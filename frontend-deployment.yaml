apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1  # Adjust the number of replicas based on your requirements
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: registry213r.azurecr.io/reactfrontend:reactfrontend-tag  # Replace with actual image tag
          ports:
            - containerPort: 3000  # Port your frontend listens on
          env:
            - name: REACT_APP_API_URL
              value: "http://backend-service.default.svc.cluster.local:8080"  # Reference backend service
